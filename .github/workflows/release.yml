# v* 태그를 푸시하면 @team-carol/design-system 을 npmjs 에 배포한다.
#   1) packages/design-system/package.json 의 version 을 올린다
#   2) git tag v0.2.0 && git push origin v0.2.0
# 토큰 없이 npm Trusted Publishing(OIDC)으로 배포한다.
# npmjs 의 패키지 Settings → Trusted Publisher 에 이 저장소와 release.yml 이 등록돼 있어야 한다.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Trusted Publishing · provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted Publishing 은 npm 11.5.1 이상이 필요하다
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish -w @team-carol/design-system
